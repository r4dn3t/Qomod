services:
  postgres:
    image: postgres:16-alpine
    container_name: qomod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qomod_users}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qomod_users}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: qomod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Web Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: qomod-users
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: 8081
      LOG_LEVEL: info
      RUN_MIGRATIONS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qomod_users}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: users.events
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: qomod-notifications
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS:-guest}
      RabbitMQ__ExchangeName: users.events
      RabbitMQ__QueueName: notifications.user-events.queue
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: qomod-auth
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8083
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-development-key-change-in-production-1234567890}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: users.events
      RABBITMQ_QUEUE: auth.user-events.queue
      USERS_SERVICE_URL: http://users:8081
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      users:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
